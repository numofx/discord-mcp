services:
  discord-mcp:
    container_name: discord-mcp
    build:
      context: .
    image: saseq/discord-mcp:latest
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-http}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      VERIFY_MESSAGE_ID: ${VERIFY_MESSAGE_ID:-}
      VERIFY_EMOJI: ${VERIFY_EMOJI:-}
      VERIFY_ROLE_ID: ${VERIFY_ROLE_ID:-}
      VERIFY_REMOVE_ON_UNREACT: ${VERIFY_REMOVE_ON_UNREACT:-false}
      TICKETS_CATEGORY_ID: ${TICKETS_CATEGORY_ID:-}
      TICKET_STAFF_ROLE_ID: ${TICKET_STAFF_ROLE_ID:-}
      TICKET_LOG_CHANNEL_ID: ${TICKET_LOG_CHANNEL_ID:-}
      TICKET_LOG_PING_STAFF: ${TICKET_LOG_PING_STAFF:-false}
      TICKET_COUNTER_CHANNEL_ID: ${TICKET_COUNTER_CHANNEL_ID:-}
      MEMBER_COUNT_CHANNEL_ID: ${MEMBER_COUNT_CHANNEL_ID:-}
      MEMBER_COUNT_FORMAT: ${MEMBER_COUNT_FORMAT:-Total Members: {count}}
      MEMBER_COUNT_EXCLUDE_BOTS: ${MEMBER_COUNT_EXCLUDE_BOTS:-true}
      MEMBER_COUNT_INTERVAL_MS: ${MEMBER_COUNT_INTERVAL_MS:-600000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
